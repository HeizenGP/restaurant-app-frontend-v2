name: customer_app
description: Base tecnica Android para clientes e invitados de Chifa ASIA.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/m01/
    - assets/images/m02/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
