name: customer_app
description: Base tecnica Android para clientes e invitados de Chifa ASIA.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.1.1
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
